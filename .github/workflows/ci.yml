name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # NIGHTLY, and this is the second tier, not a spare copy of the first.
    # The law: what runs on every commit finishes in one to two minutes. The
    # jobs that cannot are not deleted -- they move here, under the SAME job
    # names, so every check still runs somewhere and a name that goes red
    # still means what it meant. Nightly rather than weekly because the
    # go.mod floor leg moved here: a floor violation should be six hours
    # old when it is found, not six days.
    #
    # This tier also carries a real fuzzing session against the cached
    # corpus, and is the early warning when a new Go release or an @latest
    # tool breaks something with no commit of ours involved.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A SCHEDULE RUN GETS ITS OWN GROUP, and that became load-bearing the moment
  # the nightly tier got teeth. A schedule run's ref is refs/heads/main, which
  # is the same group as a push to main; cancel-in-progress is PR-only, so a
  # push landing while the nightly fuzz runs sits pending until it finishes --
  # 20m31s in the last scheduled run (34092920961, fuzz alone 1227s). Weekly
  # that was a one-in-seven window. Nightly it would be every night at 06:23Z,
  # in the hours this crew merges. github.run_id is unique per run, so every
  # schedule run is alone in its group and blocks nothing.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      # EVERY ROW HERE CARRIES COVERAGE NO OTHER ROW CARRIES, or it is not in
      # the per-commit tier.
      #
      #   ubuntu-latest/stable  -- amd64 linux, the reference leg
      #   windows-latest/stable -- the only non-unix leg; path and CRLF
      #                            behaviour, and a different linker
      #   macos-latest/stable   -- the only arm64 leg, and arm64 is
      #                            PLATFORM-SPECIFIC COVERAGE here, not a
      #                            third copy of the same test. The Go arm64
      #                            backend contracts a float multiply-add
      #                            into one FMA where the wire format
      #                            requires two roundings; that is how the
      #                            v1.8.0 writer divergence shipped with
      #                            every suite green (see the retract in
      #                            go.mod). contraction_test.go and
      #                            precomputed_test.go pin values that only
      #                            discriminate on arm64 -- on amd64 the
      #                            identical falsification passes. Drop this
      #                            row and those files stop being a guard.
      #
      #   ubuntu-latest/1.23.x  -- the go.mod floor. NIGHTLY. It catches
      #                            accidental use of newer stdlib API, which
      #                            is a real failure and a slow-moving one:
      #                            the floor moves when we move it, and the
      #                            stdlib we might reach for does not change
      #                            between one commit and the next. Same job
      #                            name, one tier down.
      matrix:
        include: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('[{"os":"ubuntu-latest","go":"stable"},{"os":"macos-latest","go":"stable"},{"os":"windows-latest","go":"stable"},{"os":"ubuntu-latest","go":"1.23.x"}]') || fromJSON('[{"os":"ubuntu-latest","go":"stable"},{"os":"macos-latest","go":"stable"},{"os":"windows-latest","go":"stable"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # This module has no dependencies and therefore no go.sum, so the
          # cache is keyed on go.mod. What it restores is the BUILD cache:
          # compiled stdlib and compiled test packages.
          #
          # WHERE THAT ACTUALLY PAYS: the windows and macOS legs, which is
          # where it matters, because windows is the roof of this tier. Each
          # OS has its own key and each leg restores the cache it saved.
          #
          # ON LINUX IT IS MOSTLY LUCK, and the comment should say so.
          # setup-go's key is setup-go-<os>-<go>-<sha256(go.mod)> with no
          # per-job component, so the six ubuntu jobs on `stable` -- this
          # leg, cross, coverage, vuln, cppcompat, apicompat -- all share one
          # key. The first to finish saves, the rest restore whatever that
          # job happened to have compiled and then cannot save their own
          # (the key is immutable). In run 34780261944 the winner was
          # cppcompat, holding little more than `go run ./compat`. Linux is
          # not the roof, so this costs nothing today; a per-job key suffix
          # or a direct actions/cache is the fix if it ever is.
          cache: true
          cache-dependency-path: go.mod
      - run: go vet ./...
      - run: go test -short -race -shuffle=on ./...
      - run: go test -shuffle=on ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # PINNED, and it moves WITH the golangci-lint pin below. golangci-lint
      # links a copy of the Go typechecker, so a linter release can only
      # typecheck the toolchains that existed when it shipped: `stable` + a
      # pinned linter is a pairing that goes red on its own, with no commit,
      # the day Go releases. It did on the sibling schema repo — 2026-08-20,
      # Go 1.27.0 landing in `stable` against v2.12.2 (May), which reported
      # `unknown field rfd in struct literal of type splicePipe` from the
      # runner's OWN internal/poll. This repo was green only because nothing
      # had pushed to it since 1.27 shipped. Value is the newest Go the
      # pinned linter can typecheck, NOT the go.mod floor — the 1.23.x test
      # leg is what guards the floor. Bumping the linter is a deliberate
      # two-line act: this version and that one, together.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # pinned so releases with new checks break CI deliberately, not
          # randomly; bump by hand
          version: v2.12.2
      - name: modernize
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest ./...

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.mod
      - name: test on a 32 bit platform (int is 32 bits, bit counts must stay 64 bit)
        run: GOARCH=386 go test ./...
      - name: build for a big endian platform
        run: GOOS=linux GOARCH=s390x go build ./...
      - name: build for wasm
        run: GOOS=js GOARCH=wasm go build ./...
      - name: build for wasi
        run: GOOS=wasip1 GOARCH=wasm go build ./...

  cppcompat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.mod
      # THE FAMILY PIN -- ONE POLICY, ONE VERSION. The C++ checkout is pinned to the
      # latest RELEASED tag of mas-bandwidth/serialize, never main, and to the SAME
      # tag in all four wire-compat gates, so "compatible with C++" means the same
      # thing in every port. Never main, because an upstream merge mid-day must not
      # change what a commit's CI proves -- the sibling-HEAD race broke family gates
      # three separate times (2026-08-16/17). Find the newest tag with:
      #   gh release list --repo mas-bandwidth/serialize --limit 1
      # Bump family-wide, deliberately, in its own commit per repo, and only
      # alongside the byte-identity check this gate runs.
      #
      # THE FLOOR: v1.7.0 is the C++ release whose compressed_float writer forces
      # the intermediate rounding -- the harness carries a vector chosen to catch a
      # contracted (FMA) quantization, and on arm64 an older header contracts
      # exactly like a broken writer would, letting the gate pass buggy against
      # buggy. v1.11.0 is the first release carrying
      # serialize_compressed_float_precomputed, which this harness drives from the
      # C++ side; v1.12.0 is the first release carrying the normative integer clamp
      # (STANDARD.md, schema#109), which the harness's two clamp witnesses make
      # load-bearing -- against an older header those rows fail the byte-identity
      # cmp, which is exactly the cross-language proof serialize#94 found missing.
      # Every release since v1.6.2 keeps the degenerate range (min == max) round
      # trippable.
      - name: download the pinned C++ serialize.h
        run: curl -fsSL --retry 3 -o compat/cpp/serialize.h https://raw.githubusercontent.com/mas-bandwidth/serialize/v1.16.2/serialize.h
      # asserts stay ON (no -DNDEBUG): they are the C++ half of "API misuse panics",
      # and the degenerate range must pass with them enabled, not around them.
      - name: build the C++ harness
        run: c++ -O2 -std=c++17 -Wall -o compat/cpp/compat compat/cpp/compat.cpp
      - name: cross language round trip
        run: |
          go run ./compat write /tmp/go.bin
          ./compat/cpp/compat write /tmp/cpp.bin
          cmp /tmp/go.bin /tmp/cpp.bin
          go run ./compat read /tmp/cpp.bin
          ./compat/cpp/compat read /tmp/go.bin

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.mod
      - name: test with coverage
        run: go test -coverprofile=cover.out ./...
      - name: coverage summary
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $NF}')
          {
            echo "<details><summary>Coverage: ${total} of statements</summary>"
            echo
            echo '```'
            go tool cover -func=cover.out
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  apicompat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.mod
      - name: gorelease
        run: |
          BASE=$(git describe --tags --abbrev=0 origin/main)
          echo "## API compatibility vs $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go run golang.org/x/exp/cmd/gorelease@latest -base="$BASE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    # NIGHTLY. This was the slowest job in the per-commit tier -- 85s and 87s
    # in the last three runs, when the next-slowest was 80s and the law is
    # 120s for the whole wall. A 30s smoke per target is also the wrong shape
    # of work to gate a commit on: fuzzing finds things by running longer, not
    # by running more often, and what it finds is almost never the diff in
    # front of it. Ten minutes per target against the cached corpus, once a
    # night, under the same job name, finds strictly more.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUZZTIME: 10m
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # deliberately OFF here, and only here: setup-go's cache covers
          # ~/.cache/go-build, which is the parent of the fuzz corpus cache
          # restored in the next step. Two caches writing one directory is a
          # corpus that silently loses entries, and this tier is nightly --
          # there is nothing here worth trading the corpus for.
          cache: false
      - name: fuzz corpus cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build/fuzz
          # run_id keys never hit exactly, so every run restores the newest
          # corpus via the prefix and saves its grown corpus under a new key
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: go test -fuzz=FuzzReadStream -fuzztime=$FUZZTIME .
      - run: go test -fuzz=FuzzRoundTrip -fuzztime=$FUZZTIME .

  spec-sync:
    name: STANDARD.md matches upstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # STANDARD.md here is a VERBATIM VENDORED COPY of the wire-format
      # specification that lives in mas-bandwidth/serialize. This job fails if the
      # two have diverged.
      #
      # Why vendor rather than link: an implementer wants the normative text
      # beside the implementation, at the revision they are reading. Why check:
      # a duplicated normative document is the same failure as a duplicated
      # constant, except it drifts silently and the ports are what break.
      #
      # If this fails, the upstream spec changed. Read the diff, port whatever
      # it implies, then copy the new file across in the same commit.
      - name: Compare against mas-bandwidth/serialize
        run: |
          curl -fsSL -o /tmp/upstream-STANDARD.md \
            https://raw.githubusercontent.com/mas-bandwidth/serialize/main/STANDARD.md
          echo "upstream: mas-bandwidth/serialize@$(git ls-remote https://github.com/mas-bandwidth/serialize.git refs/heads/main | cut -f1)"
          if ! diff -u /tmp/upstream-STANDARD.md STANDARD.md; then
            echo "::error::STANDARD.md has diverged from mas-bandwidth/serialize"
            exit 1
          fi
          echo "STANDARD.md matches upstream"

  corpus-sync:
    name: conformance/ matches upstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # conformance/ here is a VERBATIM VENDORED COPY of the shared conformance
      # corpus that lives in mas-bandwidth/serialize, one file per operation. It is
      # vendored and checked for the same reasons STANDARD.md is, and the corpus is
      # the instrument the standard names: TestConformanceCorpus runs every vector
      # in it through this port's reader. A checker that regenerates its own
      # expectations proves only that a port agrees with itself.
      #
      # If this fails, the upstream corpus changed. Read the diff, make the reader
      # pass the new vectors, then copy the directory across in the same commit.
      - name: Compare against mas-bandwidth/serialize
        run: |
          git clone --depth 1 --quiet https://github.com/mas-bandwidth/serialize.git /tmp/upstream-serialize
          echo "upstream: mas-bandwidth/serialize@$(git -C /tmp/upstream-serialize rev-parse HEAD)"
          if ! diff -ru /tmp/upstream-serialize/conformance conformance; then
            echo "::error::conformance/ has diverged from mas-bandwidth/serialize"
            exit 1
          fi
          echo "conformance/ matches upstream"
